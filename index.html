<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>星际救援 · 2.5D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#020611;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;touch-action:none}canvas{display:block;max-width:100vw;max-height:100vh;box-shadow:0 24px 80px #000b;background:#020611}#hint{position:fixed;inset:auto 12px 12px;color:#9cb6d8;font-size:11px;text-align:center;pointer-events:none;opacity:.75}
</style>
</head>
<body>
<canvas id="game" width="480" height="800"></canvas>
<div id="hint">方向键 / WASD 移动 · B 炸弹 · P 暂停 · 手机拖动操控</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=480,H=800,TAU=Math.PI*2;
const STATE={MENU:0,PLAYING:1,PAUSED:2,GAMEOVER:3,LEVELCLEAR:4};
let state=STATE.MENU,score=0,lives=3,bombs=3,level=1,frame=0,shake=0,levelTimer=0;
let weaponPower=1,weaponRate=0,weaponCount=0,missilePower=1,missileRate=0,missileCount=0,missileCooldown=0,shieldTimer=0,invincible=0;
let bullets=[],enemyBullets=[],enemies=[],missiles=[],items=[],particles=[],stars=[],clouds=[],spawnTimer=0,waveLeft=0,bossSpawned=false;
const keys={};
const player={x:W/2,y:H-120,speed:5,shoot:0,bank:0,targetBank:0,vx:0,vy:0};
let touching=false,touchDX=0,touchDY=0;

function resize(){const s=Math.min(innerWidth/W,innerHeight/H);canvas.style.width=`${W*s}px`;canvas.style.height=`${H*s}px`}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function resetSky(){stars=Array.from({length:125},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),s:rand(.4,2.1)}));clouds=Array.from({length:10},()=>({x:rand(-60,W+60),y:rand(-H,H),w:rand(80,180),h:rand(28,58),a:rand(.025,.085),speed:rand(.2,.55)}))}
resetSky();

let audio=null;function audioInit(){if(audio)return;try{audio=new (AudioContext||webkitAudioContext)()}catch{}}
function tone(f,d=.06,type='sine',gain=.03){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.45),t+d);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d)}

const blockKeys=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','b','B','p','P','a','A','d','D','w','W','s','S']);
document.addEventListener('keydown',e=>{keys[e.key]=true;if(blockKeys.has(e.key))e.preventDefault();if((e.key==='p'||e.key==='P')&&(state===STATE.PLAYING||state===STATE.PAUSED))state=state===STATE.PLAYING?STATE.PAUSED:STATE.PLAYING;if((e.key==='b'||e.key==='B')&&state===STATE.PLAYING)useBomb();if((e.key==='Enter'||e.key===' ')&&(state===STATE.MENU||state===STATE.GAMEOVER))startGame();else if((e.key==='Enter'||e.key===' ')&&state===STATE.LEVELCLEAR)nextLevel()});
document.addEventListener('keyup',e=>keys[e.key]=false);
function pointerPos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{audioInit();const p=pointerPos(e);if(state===STATE.MENU||state===STATE.GAMEOVER){startGame();return}if(state===STATE.LEVELCLEAR){nextLevel();return}if(state===STATE.PAUSED){state=STATE.PLAYING;return}touching=true;touchDX=player.x-p.x;touchDY=player.y-p.y;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!touching||state!==STATE.PLAYING)return;const p=pointerPos(e),ox=player.x;player.x=clamp(p.x+touchDX,28,W-28);player.y=clamp(p.y+touchDY,70,H-60);player.targetBank=clamp((player.x-ox)*.12,-.42,.42)});addEventListener('pointerup',()=>touching=false);

function spark(x,y,color='#ff9d4d',n=12,power=3){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(.4,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(18,42),max:42,size:rand(1,3.2),color})}}
function boom(x,y,big=false){spark(x,y,big?'#ffcf70':'#ff8748',big?42:18,big?6:3.7);particles.push({x,y,vx:0,vy:0,life:big?30:18,max:big?30:18,size:4,ring:true,color:'#ffe9b8'});shake=Math.max(shake,big?14:6);tone(big?70:120,big?.28:.11,'sawtooth',big?.08:.035)}
function exhaust(x,y,bank=0,color='#66c8ff'){particles.push({x:x+rand(-2,2),y:y+rand(-1,2),vx:-bank*2+rand(-.25,.25),vy:rand(2.6,4.5),life:rand(10,20),max:20,size:rand(1.2,3.5),color})}

function shadow(rx=28,ry=10,dy=17,a=.26){ctx.save();ctx.translate(0,dy);ctx.scale(1,ry/rx);const g=ctx.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rx,0,TAU);ctx.fill();ctx.restore()}
function metallicGradient(y0,y1,colors){const g=ctx.createLinearGradient(-22,y0,24,y1);colors.forEach((c,i)=>g.addColorStop(i/(colors.length-1),c));return g}
function drawJet(x,y,bank=0,enemy=false,scale=1,type='fighter'){
 ctx.save();ctx.translate(x,y);ctx.rotate(bank);ctx.scale(scale,scale);shadow(type==='boss'?58:31,type==='boss'?20:11,type==='boss'?28:18,type==='boss'?.38:.28);
 const hot=enemy?['#fff0d4','#ef6a5a','#6d132c','#230816']:['#f0fbff','#6dd0ff','#1d63b8','#071d4a'];
 if(type==='boss'){ctx.fillStyle=metallicGradient(-45,48,['#fbd3de','#b23663','#551634','#190914']);ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(-25,-35);ctx.lineTo(-62,-8);ctx.lineTo(-47,15);ctx.lineTo(-25,12);ctx.lineTo(-40,42);ctx.lineTo(0,30);ctx.lineTo(40,42);ctx.lineTo(25,12);ctx.lineTo(47,15);ctx.lineTo(62,-8);ctx.lineTo(25,-35);ctx.closePath();ctx.fill();ctx.fillStyle='#ff75a5';ctx.shadowBlur=22;ctx.shadowColor='#ff4f88';ctx.beginPath();ctx.ellipse(0,-6,10,17,0,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.restore();return}
 const f=12+Math.sin(frame*.45+x)*4;for(const ex of[-8,8]){const g=ctx.createLinearGradient(ex,15,ex,25+f);g.addColorStop(0,'#fff');g.addColorStop(.2,enemy?'#ffb65b':'#9ef4ff');g.addColorStop(.55,enemy?'#ff5b39':'#398bff');g.addColorStop(1,'rgba(40,90,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(ex-3,15);ctx.quadraticCurveTo(ex,24+f,ex,28+f);ctx.quadraticCurveTo(ex+3,24+f,ex+3,15);ctx.fill()}
 ctx.fillStyle=enemy?'#641c33':'#123c79';ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(-34,15);ctx.lineTo(-23,20);ctx.lineTo(-6,13);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(7,-2);ctx.lineTo(34,15);ctx.lineTo(23,20);ctx.lineTo(6,13);ctx.closePath();ctx.fill();
 ctx.fillStyle=metallicGradient(-4,18,[hot[1],hot[2],hot[3]]);ctx.beginPath();ctx.moveTo(-8,-1);ctx.lineTo(-32,12);ctx.lineTo(-20,15);ctx.lineTo(-5,8);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,-1);ctx.lineTo(32,12);ctx.lineTo(20,15);ctx.lineTo(5,8);ctx.closePath();ctx.fill();
 ctx.fillStyle=metallicGradient(-28,24,hot);ctx.beginPath();ctx.moveTo(0,-31);ctx.bezierCurveTo(-8,-21,-10,-5,-8,17);ctx.lineTo(-5,24);ctx.lineTo(5,24);ctx.lineTo(8,17);ctx.bezierCurveTo(10,-5,8,-21,0,-31);ctx.fill();
 ctx.strokeStyle=enemy?'rgba(255,210,210,.65)':'rgba(220,247,255,.75)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-28);ctx.bezierCurveTo(-2,-11,-2,6,0,20);ctx.stroke();
 const cg=ctx.createRadialGradient(-2,-12,1,0,-9,9);cg.addColorStop(0,'#e8ffff');cg.addColorStop(.25,enemy?'#ffbfb0':'#8cecff');cg.addColorStop(1,enemy?'#5a102a':'#082c66');ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(0,-10,5.4,8.7,0,0,TAU);ctx.fill();
 ctx.fillStyle=enemy?'#7c2440':'#19508f';ctx.beginPath();ctx.moveTo(-5,13);ctx.lineTo(-16,23);ctx.lineTo(-5,20);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(5,13);ctx.lineTo(16,23);ctx.lineTo(5,20);ctx.closePath();ctx.fill();ctx.restore()
}

function drawEnemy(e){if(e.type==='orb'){ctx.save();ctx.translate(e.x,e.y);shadow(18,7,14,.25);const g=ctx.createRadialGradient(-4,-5,2,0,0,17);g.addColorStop(0,'#ffd9ff');g.addColorStop(.35,'#db62ff');g.addColorStop(1,'#38105d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,15,0,TAU);ctx.fill();ctx.strokeStyle='#f39cff';ctx.globalAlpha=.7;ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,20+i*4,frame*.02+i,frame*.02+i+1.7);ctx.stroke()}ctx.restore()}else drawJet(e.x,e.y,e.bank,true,e.type==='boss'?1:e.type==='heavy'?1.25:.83,e.type==='boss'?'boss':'fighter')}

function startGame(){audioInit();state=STATE.PLAYING;score=0;lives=3;bombs=3;level=1;weaponPower=1;weaponRate=0;weaponCount=0;missilePower=1;missileRate=0;missileCount=0;shieldTimer=0;invincible=0;player.x=W/2;player.y=H-120;player.bank=0;clearWorld();prepareLevel();tone(540,.12,'sine',.04)}
function clearWorld(){bullets=[];enemyBullets=[];enemies=[];missiles=[];items=[];particles=[];spawnTimer=0;bossSpawned=false}
function prepareLevel(){waveLeft=8+level*4;spawnTimer=45;levelTimer=0}
function nextLevel(){level++;if(level>10){state=STATE.MENU;return}state=STATE.PLAYING;clearWorld();prepareLevel();player.x=W/2;player.y=H-120;shieldTimer=0;invincible=90}
function spawnEnemy(){const r=Math.random(),type=r<.16?'heavy':r<.28?'orb':'fighter';const hp=(type==='heavy'?5:type==='orb'?3:2)+(level-1)*.65;enemies.push({type,x:rand(55,W-55),y:-45,hp,maxHp:hp,speed:(type==='heavy'?.78:type==='orb'?1.05:1.45)+level*.07,phase:rand(0,TAU),shoot:rand(20,90),bank:0})}
function spawnBoss(){bossSpawned=true;const hp=80+level*28;enemies.push({type:'boss',x:W/2,y:-75,hp,maxHp:hp,speed:.55,phase:0,shoot:60,bank:0})}
function shoot(){player.shoot++;const interval=Math.max(4,17-weaponRate*2);if(player.shoot<interval)return;player.shoot=0;tone(820,.035,'square',.018);const count=Math.min(5,1+weaponCount);for(let i=0;i<count;i++){const mid=(count-1)/2,spread=(i-mid)*.075;bullets.push({x:player.x+(i-mid)*7,y:player.y-28,vx:Math.sin(spread)*8,vy:-Math.cos(spread)*8.5,dmg:weaponPower})}}
function fireMissiles(){if(missileCount<=0||missileCooldown>0||!enemies.length)return;missileCooldown=Math.max(90,230-missileRate*28);const targets=[...enemies].sort((a,b)=>dist(a,player)-dist(b,player));for(let i=0;i<Math.min(missileCount,3);i++){const t=targets[i%targets.length];missiles.push({x:player.x+(i-1)*12,y:player.y-4,target:t,speed:5.4,dmg:missilePower*3,life:150})}tone(260,.14,'sawtooth',.035)}
function enemyShoot(e){if(e.type==='boss'){const n=e.hp/e.maxHp<.45?9:5;for(let i=0;i<n;i++){const a=Math.PI/2+(i-(n-1)/2)*.16;enemyBullets.push({x:e.x,y:e.y+35,vx:Math.cos(a)*3.6,vy:Math.sin(a)*3.6,r:4})}}else{const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1,s=e.type==='heavy'?2.4:3;enemyBullets.push({x:e.x,y:e.y+16,vx:dx/d*s,vy:dy/d*s,r:e.type==='heavy'?5:3.5})}}
function useBomb(){if(!bombs)return;bombs--;shake=16;enemyBullets=[];enemies.forEach(e=>{e.hp-=12;boom(e.x,e.y,false)});particles.push({flash:true,life:14,max:14});tone(65,.35,'sawtooth',.09)}
function dropItem(e){if(Math.random()>.26)return;const types=['power','rate','count','missile','shield','life'];items.push({x:e.x,y:e.y,vy:1.4,type:types[Math.floor(Math.random()*types.length)]})}
function collect(it){tone(1100,.08,'sine',.025);spark(it.x,it.y,'#e8ffff',10,2.5);if(it.type==='power')weaponPower++;if(it.type==='rate')weaponRate++;if(it.type==='count')weaponCount=Math.min(4,weaponCount+1);if(it.type==='missile'){missileCount=Math.min(3,missileCount+1);missilePower++}if(it.type==='shield')shieldTimer=600;if(it.type==='life')lives=Math.min(5,lives+1)}
function playerHit(){if(invincible>0)return;if(shieldTimer>0){shieldTimer=0;spark(player.x,player.y,'#65ffca',20,4);shake=6;return}lives--;invincible=120;boom(player.x,player.y,true);if(lives<=0){state=STATE.GAMEOVER}}

function update(){frame++;stars.forEach(s=>{s.y+=.7+s.z*2.7;if(s.y>H){s.y=0;s.x=Math.random()*W}});clouds.forEach(c=>{c.y+=c.speed;if(c.y>H+70){c.y=-90;c.x=rand(-50,W+50)}});if(state!==STATE.PLAYING)return;if(invincible>0)invincible--;if(shieldTimer>0)shieldTimer--;if(missileCooldown>0)missileCooldown--;let mx=0,my=0;if(!touching){if(keys.ArrowLeft||keys.a||keys.A)mx--;if(keys.ArrowRight||keys.d||keys.D)mx++;if(keys.ArrowUp||keys.w||keys.W)my--;if(keys.ArrowDown||keys.s||keys.S)my++;player.vx=mx*player.speed;player.vy=my*player.speed;player.x=clamp(player.x+player.vx,28,W-28);player.y=clamp(player.y+player.vy,70,H-58);player.targetBank=clamp(mx*.35,-.4,.4)}else player.targetBank*=.92;player.bank+=(player.targetBank-player.bank)*.16;if(Math.abs(player.bank)<.01&&!mx)player.targetBank*=.86;shoot();fireMissiles();exhaust(player.x-8,player.y+20,player.bank);exhaust(player.x+8,player.y+20,player.bank);if(waveLeft>0){spawnTimer--;if(spawnTimer<=0){spawnEnemy();waveLeft--;spawnTimer=Math.max(18,58-level*3)}}else if(!enemies.length&&!bossSpawned){if([3,5,8,10].includes(level))spawnBoss();else{state=STATE.LEVELCLEAR;levelTimer=0}}bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});bullets=bullets.filter(b=>b.y>-30&&b.x>-20&&b.x<W+20);enemyBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});enemyBullets=enemyBullets.filter(b=>b.y<H+30&&b.x>-30&&b.x<W+30);enemies.forEach(e=>{e.phase+=.03;if(e.type==='boss'){if(e.y<105)e.y+=1;else e.x=W/2+Math.sin(e.phase*.55)*145;e.bank=Math.sin(e.phase*.7)*.08}else{e.y+=e.speed;e.x+=Math.sin(e.phase)*(.7+level*.03);e.bank=Math.cos(e.phase)*.14}e.shoot--;if(e.shoot<=0&&e.y>20){enemyShoot(e);e.shoot=e.type==='boss'?Math.max(24,62-level*2):rand(75,145)-level*2}});enemies=enemies.filter(e=>e.type==='boss'||e.y<H+70);missiles=missiles.filter(m=>{m.life--;if(m.life<=0||!m.target||!enemies.includes(m.target))return false;const dx=m.target.x-m.x,dy=m.target.y-m.y,d=Math.hypot(dx,dy)||1;m.x+=dx/d*m.speed;m.y+=dy/d*m.speed;if(d<18){m.target.hp-=m.dmg;boom(m.x,m.y,false);return false}exhaust(m.x,m.y,0,'#ffb05a');return true});items.forEach(i=>i.y+=i.vy);items=items.filter(i=>i.y<H+30);particles.forEach(p=>{p.life--;if(!p.flash&&!p.ring){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97}});particles=particles.filter(p=>p.life>0);bullets=bullets.filter(b=>{let hit=false;for(const e of enemies){const r=e.type==='boss'?52:e.type==='heavy'?24:18;if(dist(b,e)<r){e.hp-=b.dmg;hit=true;spark(b.x,b.y,'#a8e8ff',3,1.8);break}}return !hit});enemies=enemies.filter(e=>{if(e.hp>0)return true;score+=e.type==='boss'?5000:e.type==='heavy'?500:e.type==='orb'?320:180;boom(e.x,e.y,e.type==='boss');if(e.type==='boss'){state=STATE.LEVELCLEAR;levelTimer=0}else dropItem(e);return false});if(invincible<=0){enemyBullets=enemyBullets.filter(b=>{if(dist(b,player)<15+b.r){playerHit();return false}return true});for(const e of enemies){const r=e.type==='boss'?52:e.type==='heavy'?24:17;if(dist(e,player)<r+14){playerHit();break}}}items=items.filter(i=>{if(dist(i,player)<28){collect(i);return false}return true});if(shake>0)shake*=.88;if(shake<.3)shake=0}

function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020718');g.addColorStop(.48,'#061e3e');g.addColorStop(1,'#09111f');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);const ng=ctx.createRadialGradient(W*.72,H*.28,10,W*.72,H*.28,230);ng.addColorStop(0,'rgba(50,112,255,.13)');ng.addColorStop(.45,'rgba(56,62,180,.06)');ng.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);stars.forEach(s=>{const a=.28+s.z*.65;ctx.fillStyle=`rgba(210,235,255,${a})`;const len=s.s*(1+s.z*2.5);ctx.fillRect(s.x,s.y,s.s*.7,len)});clouds.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.fillStyle=`rgba(188,220,255,${c.a})`;ctx.filter='blur(8px)';ctx.beginPath();ctx.ellipse(0,0,c.w*.5,c.h*.5,0,0,TAU);ctx.fill();ctx.filter='none';ctx.restore()});ctx.strokeStyle='rgba(99,174,255,.07)';ctx.lineWidth=1;for(let i=0;i<10;i++){const y=(frame*3+i*91)%H,half=8+(y/H)*125;ctx.beginPath();ctx.moveTo(W/2-half,y);ctx.lineTo(W/2-half-16,y+36);ctx.moveTo(W/2+half,y);ctx.lineTo(W/2+half+16,y+36);ctx.stroke()}}
function drawBullet(b){ctx.save();ctx.translate(b.x,b.y);const g=ctx.createLinearGradient(0,8,0,-8);g.addColorStop(0,'rgba(75,190,255,0)');g.addColorStop(.6,'#67d8ff');g.addColorStop(1,'#fff');ctx.fillStyle=g;ctx.fillRect(-2,-7,4,15);ctx.restore()}
function drawEnemyBullet(b){ctx.save();ctx.translate(b.x,b.y);ctx.shadowBlur=12;ctx.shadowColor='#ff6481';ctx.fillStyle='#ffd2d9';ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.restore()}
function drawItem(i){const map={power:['威','#ff6a80'],rate:['速','#ffc85a'],count:['散','#ff9b4a'],missile:['弹','#a88cff'],shield:['盾','#57f5c0'],life:['命','#ff85b6']},[ch,c]=map[i.type];ctx.save();ctx.translate(i.x,i.y);ctx.shadowBlur=18;ctx.shadowColor=c;const g=ctx.createRadialGradient(-3,-3,1,0,0,13);g.addColorStop(0,'#fff');g.addColorStop(.3,c);g.addColorStop(1,'#10233a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,0);ctx.restore()}
function drawParticles(){particles.forEach(p=>{const a=p.life/p.max;if(p.flash){ctx.fillStyle=`rgba(255,255,255,${a*.48})`;ctx.fillRect(-20,-20,W+40,H+40);return}if(p.ring){ctx.strokeStyle=`rgba(255,226,186,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,(1-a)*48+p.size,0,TAU);ctx.stroke();return}ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1})}
function drawHUD(){ctx.save();ctx.fillStyle='rgba(3,12,27,.64)';roundRect(12,12,456,78,16);ctx.fill();ctx.strokeStyle='rgba(118,190,255,.16)';ctx.stroke();ctx.fillStyle='#eaf7ff';ctx.font='700 17px system-ui';ctx.textAlign='left';ctx.fillText(`得分 ${score.toString().padStart(6,'0')}`,25,38);ctx.textAlign='center';ctx.fillStyle='#83d7ff';ctx.fillText(`第 ${level} 关`,W/2,38);ctx.textAlign='right';ctx.fillStyle='#ff8aa3';ctx.fillText(`♥ ${lives}`,454,38);ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillStyle='#9db6d6';ctx.fillText(`主炮 ${weaponPower} · 射速 ${weaponRate} · 弹道 ${weaponCount+1}`,25,65);ctx.textAlign='right';ctx.fillText(`导弹 ${missileCount} · 炸弹 ${bombs}`,454,65);if(shieldTimer>0){ctx.fillStyle='#55efc2';ctx.fillText(`护盾 ${Math.ceil(shieldTimer/60)}秒`,454,83)}ctx.restore()}
function drawGame(){items.forEach(drawItem);enemies.forEach(drawEnemy);bullets.forEach(drawBullet);enemyBullets.forEach(drawEnemyBullet);missiles.forEach(m=>{ctx.save();ctx.translate(m.x,m.y);ctx.rotate(Math.atan2(m.target?.y-m.y||-1,m.target?.x-m.x||0)+Math.PI/2);ctx.fillStyle='#e8eef5';ctx.fillRect(-2,-6,4,12);ctx.fillStyle='#ff5b45';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(-4,-5);ctx.lineTo(4,-5);ctx.fill();ctx.restore()});if(state!==STATE.GAMEOVER){ctx.save();if(invincible>0&&Math.floor(frame/4)%2===0)ctx.globalAlpha=.38;drawJet(player.x,player.y,player.bank,false,1,'fighter');ctx.restore();if(shieldTimer>0){ctx.strokeStyle=`rgba(85,245,196,${.38+Math.sin(frame*.12)*.14})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(player.x,player.y,39,31,0,0,TAU);ctx.stroke()}}drawParticles()}
function overlay(title,sub,color='#fff'){ctx.fillStyle='rgba(1,5,14,.72)';ctx.fillRect(0,0,W,H);ctx.fillStyle=color;ctx.font='800 42px system-ui';ctx.textAlign='center';ctx.fillText(title,W/2,H*.43);ctx.fillStyle='#dceaff';ctx.font='16px system-ui';ctx.fillText(sub,W/2,H*.49)}
function drawMenu(){ctx.save();ctx.translate(W/2,H*.28);ctx.scale(1.35,1.35);drawJet(0,0,Math.sin(frame*.025)*.13,false,1,'fighter');ctx.restore();ctx.fillStyle='#eaf7ff';ctx.font='900 46px system-ui';ctx.textAlign='center';ctx.fillText('星际救援',W/2,H*.48);ctx.fillStyle='#65caff';ctx.font='600 16px system-ui';ctx.fillText('2.5D 立体战斗版',W/2,H*.52);ctx.fillStyle=`rgba(255,255,255,${.58+Math.sin(frame*.06)*.35})`;ctx.font='18px system-ui';ctx.fillText('点击 / 回车键 开始任务',W/2,H*.66);ctx.fillStyle='#7995b8';ctx.font='12px system-ui';ctx.fillText('动态滚转 · 立体光影 · 尾焰粒子 · 景深式卷轴',W/2,H*.72)}
function render(){ctx.save();if(shake){ctx.translate(rand(-shake/2,shake/2),rand(-shake/2,shake/2))}drawSky();if(state===STATE.MENU)drawMenu();else{drawGame();drawHUD();if(state===STATE.PAUSED)overlay('已暂停','点击或按 P 继续','#8edcff');if(state===STATE.GAMEOVER)overlay('任务失败',`最终得分 ${score} · 点击重新开始`,'#ff718a');if(state===STATE.LEVELCLEAR){levelTimer++;if(level===10&&bossSpawned)overlay('任务完成',`最终得分 ${score}`,'#73f5bf');else overlay(`第 ${level} 关通过`,`点击继续 · ${Math.max(0,3-Math.floor(levelTimer/60))} 秒后自动进入下一关`,'#73f5bf');if(levelTimer>180)nextLevel()}}ctx.restore()}
function loop(){update();render();requestAnimationFrame(loop)}loop();
</script>
